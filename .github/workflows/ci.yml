name: CI

# Runs every gate the environment allows on push and PR. The ONE gate CI cannot run is the
# on-chain fork gate (gate 10): it needs an external L2 RPC, which is flaky and buys nothing on a
# public repo. It stays a DECLARED SKIP here — and the "enforce" step below makes gate 10 the ONLY
# permitted skip in all of CI: any other skip (e.g. the relay schema/coherence gates going quiet
# because pyyaml failed to resolve) fails the job. A green badge must never hide a gate that did
# not run. Run gate 10 manually before deploying capital (see DEPLOY.md).

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with pinned submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive   # permit2 carries its own solmate submodule

      - name: Install Foundry (pinned)
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: "1.5.1"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned Python deps
        run: pip install -r requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ── contract suite ─────────────────────────────────────────────────────
      # JSON output feeds the skip-enforcement step below (it binds the one allowed skip to gate
      # 10 by NAME). A real test failure fails the job right here.
      - name: forge test (JSON for skip enforcement)
        run: forge test --json > forge.json

      # ── signing core + distribution suites (per-suite status) ────────────────
      - name: client triple-digest harness (tamper on all 10 fields)
        run: python3 client/test_spartan1.py

      - name: relay conformance + schema + cross-leg coherence
        run: python3 distribution/test_relay.py

      - name: maker conformance
        run: python3 distribution/test_maker.py

      - name: executor conformance + off-chain e2e
        run: python3 distribution/test_executor.py

      - name: cross-leg coherence gate
        run: python3 scripts/check_coherence.py

      # ── the enforcement gate: gate 10 is the ONLY skip permitted anywhere ─────
      # Fails if forge skipped anything other than gate 10 (or is missing gate 10), or if any
      # Python conformance suite reported a skip in its RESULT line (e.g. pyyaml unresolved →
      # schema/coherence gates silently disabled). Also writes the authoritative contract-gate
      # summary to $GITHUB_STEP_SUMMARY.
      - name: enforce — gate 10 is the ONLY skip anywhere in CI
        run: |
          python3 scripts/ci_no_unexpected_skips.py --forge forge.json \
            client/test_spartan1.py distribution/test_relay.py \
            distribution/test_maker.py distribution/test_executor.py

      # ── SDK ──────────────────────────────────────────────────────────────────
      - name: SDK install + typecheck + tests (no silent test.skip)
        working-directory: sdk
        run: |
          set -o pipefail
          npm ci
          npm run typecheck
          npm test | tee sdk.log
          grep -q '^# skipped 0$' sdk.log || { echo "::error::SDK reported skipped tests"; exit 1; }
